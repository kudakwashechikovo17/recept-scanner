{% extends 'base.html' %}
{% block title %}Upload Receipt - Earthsafe{% endblock %}
{% block content %}
<h1 class="mb-3">Upload a Receipt</h1>
{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}
<form action="/" method="post" enctype="multipart/form-data">
  <div class="mb-3">
    <input class="form-control" type="file" name="document" accept="image/*,application/pdf">
  </div>
  <button class="btn btn-primary" type="submit">Extract</button>
</form>
{% endblock %}
